<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d0a1f">
<title>오늘 누가 쏠까?</title>
<meta name="description" content="참가자 이름을 넣고 룰렛을 돌려 오늘 계산할 사람을 정하세요.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0d0a1f;
    --bg2: #1a1240;
    --glass: rgba(255,255,255,.06);
    --glass-line: rgba(255,255,255,.12);
    --text: #fbf7ff;
    --muted: #b3a9d6;
    --gold1: #fff3b0;
    --gold2: #ffd54a;
    --gold3: #e8a10c;
    --gold4: #9a5b00;
    --danger: #ff6b8a;
    --display: "Black Han Sans", "Noto Sans KR", sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: "Noto Sans KR", system-ui, -apple-system, sans-serif;
    min-height: 100vh; min-height: 100dvh;
    padding: max(18px, env(safe-area-inset-top)) 16px max(24px, env(safe-area-inset-bottom));
    -webkit-tap-highlight-color: transparent;
    overflow-x: hidden;
  }
  /* ambient background */
  .bg { position: fixed; inset: 0; z-index: -1; overflow: hidden;
    background: radial-gradient(ellipse 120% 80% at 50% -10%, #3a1f7a 0%, var(--bg2) 35%, var(--bg) 75%); }
  .bg i { position: absolute; border-radius: 50%; filter: blur(70px); opacity: .45; animation: drift 18s ease-in-out infinite alternate; }
  .bg i:nth-child(1) { width: 46vmax; height: 46vmax; background: #ff3d8b; left: -14vmax; top: 20vh; }
  .bg i:nth-child(2) { width: 40vmax; height: 40vmax; background: #4f46e5; right: -12vmax; top: -8vmax; animation-delay: -6s; }
  .bg i:nth-child(3) { width: 34vmax; height: 34vmax; background: #f5b301; right: 10vw; bottom: -18vmax; opacity: .22; animation-delay: -11s; }
  .bg::after { content: ""; position: absolute; inset: 0;
    background-image: radial-gradient(1.5px 1.5px at 20% 30%, #fff8 50%, transparent 51%), radial-gradient(1px 1px at 70% 20%, #fff6 50%, transparent 51%),
      radial-gradient(1.2px 1.2px at 40% 80%, #fff5 50%, transparent 51%), radial-gradient(1px 1px at 85% 65%, #fff7 50%, transparent 51%),
      radial-gradient(1.4px 1.4px at 10% 75%, #fff5 50%, transparent 51%), radial-gradient(1px 1px at 55% 45%, #fff4 50%, transparent 51%);
    background-size: 380px 380px; animation: twinkle 6s ease-in-out infinite alternate; }
  @keyframes drift { to { transform: translate(6vw, -4vh) scale(1.12); } }
  @keyframes twinkle { from { opacity: .5 } to { opacity: 1 } }

  header { text-align: center; margin: 6px 0 22px; }
  .badge { display: inline-block; font-size: 12px; letter-spacing: .2em; color: var(--gold2);
    border: 1px solid rgba(255,213,74,.4); border-radius: 99px; padding: 4px 12px; margin-bottom: 10px;
    background: rgba(255,213,74,.08); }
  h1 { font-family: var(--display); font-weight: 400; font-size: clamp(34px, 9vw, 58px); margin: 0; line-height: 1.1;
    background: linear-gradient(100deg, var(--gold4) 0%, var(--gold2) 20%, var(--gold1) 35%, var(--gold2) 50%, var(--gold3) 70%, var(--gold1) 85%, var(--gold2) 100%);
    background-size: 250% 100%;
    -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 3px 0 #5a3300) drop-shadow(0 0 24px rgba(255,200,60,.35));
    animation: shimmer 5s linear infinite; }
  @keyframes shimmer { to { background-position: -250% 0; } }
  header p { margin: 10px 0 0; color: var(--muted); font-size: 14px; }

  main { max-width: 1020px; margin: 0 auto; display: grid; gap: 28px; grid-template-columns: 1fr; }
  @media (min-width: 860px) { main { grid-template-columns: 1.35fr 1fr; align-items: start; } }

  /* wheel */
  .wheel-wrap { display: flex; flex-direction: column; align-items: center; gap: 32px; }
  .wheel { position: relative; width: min(100%, 540px, 66vh); aspect-ratio: 1; margin-top: 10px; }
  .wheel::before { /* glow */
    content: ""; position: absolute; inset: -6%; border-radius: 50%;
    background: radial-gradient(circle, rgba(255,200,60,.35) 0%, rgba(255,61,139,.15) 45%, transparent 70%);
    filter: blur(10px); z-index: 0; }
  .rim { position: absolute; inset: 0; border-radius: 50%; z-index: 1;
    background: conic-gradient(from 0deg, var(--gold3), var(--gold1), var(--gold3), var(--gold4), var(--gold2), var(--gold1), var(--gold3), var(--gold4), var(--gold3));
    box-shadow: 0 24px 60px rgba(0,0,0,.6), inset 0 0 0 2px rgba(255,255,255,.35), inset 0 0 18px rgba(90,50,0,.8); }
  .rim::after { content: ""; position: absolute; inset: 6.5%; border-radius: 50%;
    background: #1a0f05; box-shadow: 0 0 0 3px #5a3300, inset 0 0 20px rgba(0,0,0,.9); }
  .bulbs { position: absolute; inset: 0; z-index: 2; pointer-events: none; }
  .bulb { position: absolute; width: 2.6%; aspect-ratio: 1; border-radius: 50%; transform: translate(-50%, -50%);
    background: radial-gradient(circle at 35% 35%, #fff, #fff6c2 40%, #ffb300 75%);
    box-shadow: 0 0 6px 2px rgba(255,220,100,.9), 0 0 14px 4px rgba(255,170,0,.5);
    animation: blink 1.2s steps(1) infinite; }
  .bulb:nth-child(even) { animation-delay: -.6s; }
  .wheel.spinning .bulb { animation-duration: .24s; }
  .wheel.spinning .bulb:nth-child(even) { animation-delay: -.12s; }
  .wheel.won .bulb { animation: none; background: radial-gradient(circle at 35% 35%, #fff, #ffe7f1 40%, #ff3d8b 75%);
    box-shadow: 0 0 8px 3px rgba(255,90,160,.95), 0 0 18px 6px rgba(255,61,139,.55); }
  @keyframes blink { 50% { background: radial-gradient(circle at 35% 35%, #8a6a2a, #5a3f10 70%); box-shadow: none; } }

  .wheel canvas { position: absolute; inset: 8%; width: 84%; height: 84%; border-radius: 50%; z-index: 3; display: block; }
  .gloss { position: absolute; inset: 8%; border-radius: 50%; z-index: 4; pointer-events: none;
    background: radial-gradient(ellipse 70% 45% at 40% 18%, rgba(255,255,255,.28), transparent 60%),
                radial-gradient(circle at 50% 50%, transparent 62%, rgba(0,0,0,.35) 100%); }

  .pointer { position: absolute; top: -3.5%; left: 50%; transform: translateX(-50%); width: 11%; z-index: 6;
    filter: drop-shadow(0 4px 4px rgba(0,0,0,.6)); transform-origin: 50% 20%; }
  .wheel.spinning .pointer { animation: wobble .12s ease-in-out infinite alternate; }
  @keyframes wobble { from { transform: translateX(-50%) rotate(-6deg); } to { transform: translateX(-50%) rotate(4deg); } }

  .hub { position: absolute; inset: 0; margin: auto; z-index: 5;
    width: 21%; aspect-ratio: 1; border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #4a2a8a, #1d0f45 70%);
    border: none; padding: 0;
    box-shadow: 0 0 0 5px var(--gold2), 0 0 0 8px var(--gold4), 0 8px 24px rgba(0,0,0,.7), inset 0 -6px 14px rgba(0,0,0,.6), inset 0 4px 10px rgba(255,255,255,.18);
    display: grid; place-items: center; cursor: pointer; user-select: none; transition: transform .15s; }
  .hub span { font-family: var(--display); font-size: clamp(18px, 5.5vw, 30px);
    background: linear-gradient(180deg, var(--gold1), var(--gold2) 50%, var(--gold3));
    -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 2px 0 #3a1f00); }
  .hub:hover { transform: scale(1.05); }
  .hub:active { transform: scale(.94); }

  .spin-btn { position: relative; overflow: hidden;
    width: min(100%, 540px); padding: 18px; border: 0; border-radius: 18px;
    background: linear-gradient(180deg, var(--gold1) 0%, var(--gold2) 35%, var(--gold3) 100%);
    color: #3a1f00; font-family: var(--display); font-size: 24px; letter-spacing: .02em;
    box-shadow: 0 6px 0 var(--gold4), 0 10px 30px rgba(255,180,0,.35), inset 0 2px 0 rgba(255,255,255,.7);
    cursor: pointer; transition: transform .1s, box-shadow .1s, filter .2s; }
  .spin-btn::after { content: ""; position: absolute; top: 0; bottom: 0; width: 40%; left: -60%;
    background: linear-gradient(100deg, transparent, rgba(255,255,255,.75), transparent); transform: skewX(-20deg);
    animation: sweep 3.2s ease-in-out infinite; }
  @keyframes sweep { 0%, 60% { left: -60%; } 100% { left: 130%; } }
  .spin-btn:active { transform: translateY(4px); box-shadow: 0 2px 0 var(--gold4), 0 6px 18px rgba(255,180,0,.3), inset 0 2px 0 rgba(255,255,255,.7); }
  .spin-btn:disabled { filter: grayscale(.7) brightness(.6); cursor: not-allowed; }
  .spin-btn:disabled::after { display: none; }

  /* panel */
  .panel { position: relative; background: var(--glass); border: 1px solid var(--glass-line);
    border-radius: 22px; padding: 20px; backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
    box-shadow: 0 20px 50px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.08); }
  .panel h2 { font-family: var(--display); font-weight: 400; font-size: 20px; margin: 0 0 14px; display: flex; justify-content: space-between; align-items: center; }
  .panel h2 small { font-family: "Noto Sans KR", sans-serif; font-weight: 700; font-size: 12px; color: #3a1f00;
    background: linear-gradient(180deg, var(--gold1), var(--gold2)); border-radius: 99px; padding: 3px 10px; }

  .add-row { display: flex; gap: 8px; }
  .add-row input { flex: 1; min-width: 0; padding: 13px 14px; border-radius: 12px;
    border: 1px solid var(--glass-line); background: rgba(0,0,0,.3); color: var(--text);
    font: inherit; font-size: 16px; transition: border-color .2s, box-shadow .2s; }
  .add-row input::placeholder { color: #8c82b3; }
  .add-row input:focus { outline: none; border-color: var(--gold2); box-shadow: 0 0 0 3px rgba(255,213,74,.2); }
  .btn { padding: 12px 16px; border-radius: 12px; border: 1px solid var(--glass-line);
    background: rgba(255,255,255,.07); color: var(--text); font: inherit; font-weight: 700;
    cursor: pointer; white-space: nowrap; transition: background .2s, transform .1s; }
  .btn:hover { background: rgba(255,255,255,.13); }
  .btn:active { transform: scale(.97); }
  .btn.primary { background: linear-gradient(180deg, var(--gold1), var(--gold2) 40%, var(--gold3)); color: #3a1f00; border: 0;
    box-shadow: 0 3px 0 var(--gold4), inset 0 1px 0 rgba(255,255,255,.7); }

  ul.items { list-style: none; margin: 14px 0 0; padding: 0; display: grid; gap: 6px; max-height: 340px; overflow-y: auto; }
  ul.items li { display: flex; align-items: center; gap: 12px; padding: 9px 10px 9px 12px; border-radius: 12px;
    background: rgba(0,0,0,.25); border: 1px solid rgba(255,255,255,.05); animation: slidein .25s ease-out; }
  @keyframes slidein { from { opacity: 0; transform: translateY(-4px); } }
  .dot { width: 14px; height: 14px; border-radius: 50%; flex: none; box-shadow: 0 0 8px currentColor, inset 0 -2px 3px rgba(0,0,0,.3); }
  ul.items li span.name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 700; }
  .del { border: 0; background: none; color: var(--muted); font-size: 20px; cursor: pointer; padding: 2px 8px; line-height: 1; border-radius: 8px; }
  .del:hover { color: var(--danger); background: rgba(255,107,138,.12); }
  .empty { color: var(--muted); justify-content: center; font-size: 14px; }

  .toolbar { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
  .toolbar .btn { flex: 1 1 auto; font-size: 14px; padding: 10px 12px; }
  .opt { display: flex; align-items: center; gap: 8px; margin-top: 14px; color: var(--muted); font-size: 14px; cursor: pointer; }
  .opt input { width: 18px; height: 18px; accent-color: var(--gold2); }

  .history { margin-top: 20px; padding-top: 16px; border-top: 1px dashed var(--glass-line); }
  .history ol { margin: 0; padding-left: 22px; color: var(--muted); font-size: 14px; display: grid; gap: 4px; max-height: 160px; overflow-y: auto; }
  .history ol li:first-child { color: var(--gold2); font-weight: 700; }
  .history ol:empty::before { content: "아직 기록이 없어요"; margin-left: -22px; font-size: 13px; }

  /* result modal */
  .modal { position: fixed; inset: 0; background: rgba(6,3,18,.72); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
    display: none; place-items: center; padding: 16px; z-index: 10; }
  .modal.show { display: grid; animation: fade .2s; }
  .modal .card { position: relative; text-align: center; width: min(100%, 400px); padding: 3px; border-radius: 26px;
    background: conic-gradient(from var(--a, 0deg), var(--gold3), var(--gold1), #ff3d8b, var(--gold2), var(--gold1), var(--gold3));
    box-shadow: 0 0 60px rgba(255,200,60,.35), 0 30px 60px rgba(0,0,0,.6);
    animation: pop .45s cubic-bezier(.2,1.6,.4,1), spinborder 4s linear infinite; }
  .card-in { background: radial-gradient(ellipse at top, #3a1f7a, #150c35 70%); border-radius: 23px; padding: 30px 24px 24px; }
  @property --a { syntax: "<angle>"; inherits: false; initial-value: 0deg; }
  @keyframes spinborder { to { --a: 360deg; } }
  .card .crown { font-size: 44px; line-height: 1; animation: bob 1.4s ease-in-out infinite alternate; }
  @keyframes bob { to { transform: translateY(-6px) rotate(-6deg); } }
  .card .label { color: var(--muted); font-size: 14px; margin-top: 8px; }
  .card .result { font-family: var(--display); font-size: clamp(34px, 10vw, 50px); margin: 6px 0 8px; word-break: break-word; line-height: 1.15;
    background: linear-gradient(180deg, var(--gold1), var(--gold2) 50%, var(--gold3)); -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 3px 0 #4a2700); }
  .card .pay { color: var(--text); font-weight: 700; margin: 0 0 22px; font-size: 17px; opacity: .9; }
  .card .actions { display: flex; gap: 8px; }
  .card .actions .btn { flex: 1; }
  @keyframes fade { from { opacity: 0 } }
  @keyframes pop { from { transform: scale(.5) rotate(-6deg); opacity: 0 } }

  footer { text-align: center; color: var(--muted); font-size: 12px; margin-top: 32px; opacity: .7; letter-spacing: .08em; }
  #confetti { position: fixed; inset: 0; pointer-events: none; z-index: 11; width: 100%; height: 100%; }

  @media (prefers-reduced-motion: reduce) {
    .bg i, .bg::after, h1, .spin-btn::after, .bulb, .card, .crown { animation: none !important; }
  }
</style>
</head>
<body>
<div class="bg"><i></i><i></i><i></i></div>

<header>
  <div class="badge">WHO PAYS TODAY</div>
  <h1>오늘 누가 쏠까?</h1>
  <p>참가자 이름을 넣고 돌리세요. 걸린 사람이 계산! 💸</p>
</header>

<main>
  <section class="wheel-wrap">
    <div class="wheel" id="wheelBox">
      <div class="rim"></div>
      <div class="bulbs" id="bulbs"></div>
      <canvas id="wheel" width="1040" height="1040" aria-label="룰렛 휠"></canvas>
      <div class="gloss"></div>
      <svg class="pointer" viewBox="0 0 60 80" aria-hidden="true">
        <defs>
          <linearGradient id="pg" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#fff3b0"/><stop offset=".45" stop-color="#ffd54a"/><stop offset="1" stop-color="#b06d00"/></linearGradient>
          <radialGradient id="gem" cx=".35" cy=".35" r=".7"><stop offset="0" stop-color="#fff"/><stop offset=".25" stop-color="#ff8ab8"/><stop offset="1" stop-color="#b0124f"/></radialGradient>
        </defs>
        <path d="M30 78 L6 26 A26 26 0 1 1 54 26 Z" fill="url(#pg)" stroke="#6b3d00" stroke-width="2.5" stroke-linejoin="round"/>
        <circle cx="30" cy="24" r="11" fill="url(#gem)" stroke="#6b3d00" stroke-width="2"/>
      </svg>
      <button class="hub" id="hub" aria-label="돌리기"><span>GO</span></button>
    </div>
    <button class="spin-btn" id="spin">누가 낼까? 돌리기!</button>
  </section>

  <section class="panel">
    <h2>참가자 <small id="count"></small></h2>
    <form class="add-row" id="addForm">
      <input id="itemInput" placeholder="이름 입력 (쉼표로 여러 명)" maxlength="60" autocomplete="off" enterkeyhint="done">
      <button class="btn primary" type="submit">추가</button>
    </form>
    <ul class="items" id="items"></ul>
    <div class="toolbar">
      <button class="btn" id="shuffle">🔀 섞기</button>
      <button class="btn" id="reset">↩︎ 처음 상태로</button>
      <button class="btn" id="clear">🗑 전체 삭제</button>
    </div>
    <label class="opt"><input type="checkbox" id="removeWinner"> 걸린 사람은 다음 판에서 빼기 (2차, 3차용)</label>

    <div class="history">
      <h2>기록</h2>
      <ol id="history"></ol>
    </div>
  </section>
</main>

<footer>roulette.hyoung.io</footer>

<div class="modal" id="modal" role="dialog" aria-modal="true">
  <div class="card"><div class="card-in">
    <div class="crown">👑</div>
    <div class="label">오늘 계산은…</div>
    <div class="result" id="resultText"></div>
    <div class="pay" id="payText"></div>
    <div class="actions">
      <button class="btn" id="closeModal">닫기</button>
      <button class="btn primary" id="again">다시 내기</button>
    </div>
  </div></div>
</div>
<canvas id="confetti"></canvas>

<script>
(() => {
  const COLORS = ["#e11d63","#2563eb","#10b981","#f59e0b","#8b5cf6","#f97316","#0ea5e9","#d946ef","#22c55e","#6366f1"];
  const DEFAULT = ["철수","영희","민수","지은"];
  const KEY = "hyoung-whopays-v1";

  const $ = id => document.getElementById(id);
  const canvas = $("wheel"), ctx = canvas.getContext("2d");
  const size = canvas.width, R = size / 2;

  let state = { items: DEFAULT.slice(), history: [], removeWinner: false };
  try { const s = JSON.parse(localStorage.getItem(KEY)); if (s && Array.isArray(s.items)) state = { ...state, ...s }; } catch {}
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch {} };

  let angle = 0, spinning = false, highlight = -1, pendingRemove = -1;

  // bulbs around the rim
  (() => {
    const box = $("bulbs"), N = 24;
    for (let k = 0; k < N; k++) {
      const a = k / N * Math.PI * 2, b = document.createElement("span");
      b.className = "bulb";
      b.style.left = (50 + 46.8 * Math.cos(a)) + "%";
      b.style.top = (50 + 46.8 * Math.sin(a)) + "%";
      box.appendChild(b);
    }
  })();

  function colorFor(i, n) {
    let c = COLORS[i % COLORS.length];
    if (n > 1 && i === n - 1 && i % COLORS.length === 0) c = COLORS[(i + 3) % COLORS.length];
    return c;
  }
  function shade(hex, amt) { // amt -1..1
    const n = parseInt(hex.slice(1), 16);
    let r = n >> 16, g = (n >> 8) & 255, b = n & 255;
    const t = amt < 0 ? 0 : 255, p = Math.abs(amt);
    r = Math.round((t - r) * p + r); g = Math.round((t - g) * p + g); b = Math.round((t - b) * p + b);
    return `rgb(${r},${g},${b})`;
  }

  function draw() {
    const items = state.items, n = items.length;
    ctx.clearRect(0, 0, size, size);
    ctx.save();
    ctx.translate(R, R);
    if (n === 0) {
      const g = ctx.createRadialGradient(0, 0, 0, 0, 0, R);
      g.addColorStop(0, "#3a2a6a"); g.addColorStop(1, "#1a1035");
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(0, 0, R, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = "#b3a9d6"; ctx.font = "700 46px 'Noto Sans KR', sans-serif";
      ctx.textAlign = "center"; ctx.fillText("참가자를 추가하세요", 0, R * 0.5);
      ctx.restore();
      return;
    }
    ctx.rotate(angle);
    const seg = Math.PI * 2 / n;
    for (let i = 0; i < n; i++) {
      const start = -Math.PI / 2 + i * seg - seg / 2;
      const col = colorFor(i, n);
      const g = ctx.createRadialGradient(0, 0, R * 0.12, 0, 0, R);
      g.addColorStop(0, shade(col, 0.45));
      g.addColorStop(0.55, col);
      g.addColorStop(1, shade(col, -0.35));
      ctx.beginPath(); ctx.moveTo(0, 0); ctx.arc(0, 0, R, start, start + seg); ctx.closePath();
      ctx.fillStyle = g; ctx.fill();
      if (highlight >= 0 && i !== highlight) { ctx.fillStyle = "rgba(10,5,25,.62)"; ctx.fill(); }

      // label
      ctx.save();
      ctx.rotate(start + seg / 2);
      ctx.textAlign = "right"; ctx.textBaseline = "middle";
      const fs = Math.max(24, Math.min(62, 600 / n + 14));
      ctx.font = `900 ${fs}px 'Noto Sans KR', sans-serif`;
      let label = items[i];
      const maxW = R * 0.62;
      while (ctx.measureText(label).width > maxW && label.length > 1) label = label.slice(0, -1);
      if (label !== items[i]) label = label.slice(0, -1) + "…";
      ctx.shadowColor = "rgba(0,0,0,.55)"; ctx.shadowBlur = 8; ctx.shadowOffsetY = 3;
      ctx.fillStyle = (highlight >= 0 && i !== highlight) ? "rgba(255,255,255,.45)" : "#fff";
      ctx.fillText(label, R - 44, 0);
      ctx.restore();
    }
    // gold separators
    ctx.lineCap = "round";
    for (let i = 0; i < n; i++) {
      const a = -Math.PI / 2 + i * seg - seg / 2;
      ctx.beginPath(); ctx.moveTo(Math.cos(a) * R * 0.2, Math.sin(a) * R * 0.2); ctx.lineTo(Math.cos(a) * R, Math.sin(a) * R);
      ctx.strokeStyle = "#6b3d00"; ctx.lineWidth = 9; ctx.stroke();
      ctx.strokeStyle = "#ffd54a"; ctx.lineWidth = 4; ctx.stroke();
      // stud
      ctx.beginPath(); ctx.arc(Math.cos(a) * R * 0.93, Math.sin(a) * R * 0.93, 11, 0, Math.PI * 2);
      const sg = ctx.createRadialGradient(Math.cos(a) * R * 0.93 - 3, Math.sin(a) * R * 0.93 - 3, 1, Math.cos(a) * R * 0.93, Math.sin(a) * R * 0.93, 11);
      sg.addColorStop(0, "#fff8d0"); sg.addColorStop(1, "#c88a00");
      ctx.fillStyle = sg; ctx.fill();
    }
    // winner ring
    if (highlight >= 0) {
      const start = -Math.PI / 2 + highlight * seg - seg / 2;
      ctx.beginPath(); ctx.arc(0, 0, R - 8, start, start + seg);
      ctx.strokeStyle = "#fff3b0"; ctx.lineWidth = 14; ctx.shadowColor = "#ffd54a"; ctx.shadowBlur = 30; ctx.stroke();
    }
    ctx.restore();
  }

  function renderList() {
    const ul = $("items"); ul.innerHTML = "";
    const n = state.items.length;
    if (!n) ul.innerHTML = '<li class="empty">아직 참가자가 없어요</li>';
    state.items.forEach((t, i) => {
      const li = document.createElement("li");
      const c = colorFor(i, n);
      li.innerHTML = `<span class="dot" style="background:${c};color:${c}"></span><span class="name"></span><button class="del" aria-label="삭제">×</button>`;
      li.querySelector(".name").textContent = t;
      li.querySelector(".del").onclick = () => { if (spinning) return; state.items.splice(i, 1); update(); };
      ul.appendChild(li);
    });
    $("count").textContent = `${n}명`;
    $("spin").disabled = n < 2;
    const ol = $("history"); ol.innerHTML = "";
    state.history.slice(0, 20).forEach(h => { const li = document.createElement("li"); li.textContent = h; ol.appendChild(li); });
    $("removeWinner").checked = !!state.removeWinner;
  }

  function update() { save(); renderList(); draw(); }

  // ---- sound ----
  let audioCtx;
  function beep(freq, dur, vol, type = "square") {
    try {
      audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
      const o = audioCtx.createOscillator(), g = audioCtx.createGain(), t = audioCtx.currentTime;
      o.frequency.value = freq; o.type = type;
      g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(g).connect(audioCtx.destination); o.start(t); o.stop(t + dur + 0.01);
    } catch {}
  }
  const tick = () => beep(1400, 0.035, 0.035);
  const fanfare = () => [523, 659, 784, 1047].forEach((f, i) => setTimeout(() => beep(f, i === 3 ? 0.45 : 0.14, 0.06, "triangle"), i * 110));

  // ---- spin ----
  function spin() {
    commitRemoval();
    const n = state.items.length;
    if (spinning || n < 2) return;
    spinning = true; highlight = -1; $("spin").disabled = true;
    $("wheelBox").classList.remove("won"); $("wheelBox").classList.add("spinning");
    const seg = Math.PI * 2 / n;
    const winner = Math.floor(Math.random() * n);
    const jitter = (Math.random() - 0.5) * seg * 0.8;
    const base = -winner * seg + jitter;
    const cur = ((angle % (Math.PI * 2)) + Math.PI * 2) % (Math.PI * 2);
    let delta = ((base - cur) % (Math.PI * 2) + Math.PI * 2) % (Math.PI * 2);
    delta += Math.PI * 2 * (6 + Math.floor(Math.random() * 3));
    const start = angle, dur = 5200 + Math.random() * 1200, t0 = performance.now();
    const ease = t => 1 - Math.pow(1 - t, 4);
    let lastSeg = Math.floor((start + seg / 2) / seg);

    function frame(now) {
      const t = Math.min(1, (now - t0) / dur);
      angle = start + delta * ease(t);
      const s = Math.floor((angle + seg / 2) / seg);
      if (s !== lastSeg) { lastSeg = s; tick(); if (navigator.vibrate) navigator.vibrate(4); }
      draw();
      if (t < 1) requestAnimationFrame(frame);
      else finish(winner);
    }
    requestAnimationFrame(frame);
  }

  function finish(i) {
    spinning = false;
    $("wheelBox").classList.remove("spinning"); $("wheelBox").classList.add("won");
    highlight = i; draw();
    const name = state.items[i];
    state.history.unshift(name);
    state.history = state.history.slice(0, 50);
    if (state.removeWinner) pendingRemove = i;
    update();
    fanfare();
    if (navigator.vibrate) navigator.vibrate([60, 40, 120]);
    setTimeout(() => {
      $("resultText").textContent = `${name} 님이 쏩니다!`;
      $("payText").textContent = "잘 먹겠습니다 🙏";
      $("modal").classList.add("show");
      confetti();
    }, 650);
  }

  function commitRemoval() {
    if (pendingRemove >= 0) { state.items.splice(pendingRemove, 1); pendingRemove = -1; highlight = -1; update(); }
  }

  // ---- confetti ----
  function confetti() {
    const c = $("confetti"), x = c.getContext("2d");
    const dpr = window.devicePixelRatio || 1;
    c.width = innerWidth * dpr; c.height = innerHeight * dpr; x.setTransform(dpr, 0, 0, dpr, 0, 0);
    const palette = [...COLORS, "#ffd54a", "#fff3b0", "#ffd54a"];
    const parts = Array.from({ length: 180 }, (_, k) => ({
      x: k % 2 ? innerWidth * 0.15 : innerWidth * 0.85, y: innerHeight * 0.75,
      vx: (k % 2 ? 1 : -1) * (3 + Math.random() * 9), vy: -(12 + Math.random() * 12),
      s: 6 + Math.random() * 7, r: Math.random() * 6, vr: (Math.random() - 0.5) * .35,
      c: palette[Math.floor(Math.random() * palette.length)], round: Math.random() < 0.3
    }));
    const t0 = performance.now();
    (function f(now) {
      x.clearRect(0, 0, innerWidth, innerHeight);
      parts.forEach(p => {
        p.vy += 0.38; p.vx *= 0.985; p.x += p.vx; p.y += p.vy; p.r += p.vr;
        x.save(); x.translate(p.x, p.y); x.rotate(p.r); x.fillStyle = p.c;
        if (p.round) { x.beginPath(); x.arc(0, 0, p.s / 3, 0, Math.PI * 2); x.fill(); }
        else x.fillRect(-p.s / 2, -p.s / 4, p.s, p.s / 2);
        x.restore();
      });
      if (now - t0 < 3200) requestAnimationFrame(f); else x.clearRect(0, 0, innerWidth, innerHeight);
    })(t0);
  }

  // ---- events ----
  $("spin").onclick = spin;
  $("hub").onclick = spin;
  $("addForm").onsubmit = e => {
    e.preventDefault();
    if (spinning) return;
    commitRemoval();
    const v = $("itemInput").value.split(",").map(s => s.trim()).filter(Boolean);
    if (!v.length) return;
    highlight = -1; $("wheelBox").classList.remove("won");
    state.items.push(...v.map(s => s.slice(0, 60)));
    state.items = state.items.slice(0, 40);
    $("itemInput").value = "";
    update();
  };
  const guard = fn => () => { if (spinning) return; commitRemoval(); highlight = -1; $("wheelBox").classList.remove("won"); fn(); };
  $("shuffle").onclick = guard(() => {
    const a = state.items;
    for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
    update();
  });
  $("reset").onclick = guard(() => { state.items = DEFAULT.slice(); update(); });
  $("clear").onclick = guard(() => { if (confirm("참가자를 모두 지울까요?")) { state.items = []; state.history = []; update(); } });
  $("removeWinner").onchange = e => { state.removeWinner = e.target.checked; save(); };
  const close = () => { $("modal").classList.remove("show"); commitRemoval(); };
  $("closeModal").onclick = close;
  $("modal").onclick = e => { if (e.target.id === "modal") close(); };
  $("again").onclick = () => { close(); setTimeout(spin, 150); };
  document.addEventListener("keydown", e => { if (e.key === "Escape") close(); });

  update();
  if (document.fonts) document.fonts.ready.then(draw);
})();
</script>
</body>
</html>
